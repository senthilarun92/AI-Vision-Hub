<div class="container pb-5">

    <h2 class="fw-bold mb-1"><i class="fa-solid fa-id-card text-primary"></i> Number Plate Detection</h2>
    <p class="text-muted mb-4">Upload a vehicle image to detect and read the number plate.</p>

    <div class="av-card p-4 mb-4">

        <div class="upload-drop mb-3">
            <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" class="form-control mb-3" style="max-width:400px;margin:0 auto;">
            <button type="button" id="detectButton" class="btn btn-av px-4 py-2">
                <i class="fa-solid fa-magnifying-glass"></i> Detect Number Plate
            </button>
        </div>

        <div id="previewContainer" class="text-center mb-3 d-none">
            <img id="imagePreview" class="img-fluid rounded" style="max-height:400px;">
        </div>

        <div id="loading" class="spinner-wrap d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Detecting number plate...</p>
        </div>

    </div>

    <div id="resultBox" class="av-card p-4 d-none">
        <h5 class="mb-3">Detection Result</h5>
        <div id="results"></div>
    </div>

</div>
