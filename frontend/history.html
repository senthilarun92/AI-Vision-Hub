    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html"><i class="fa-solid fa-car-side"></i>AI Vision Hub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i>Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high me-1"></i>Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="vehicle.html"><i class="fa-solid fa-car me-1"></i>Vehicle Detection</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="plate.html"><i class="fa-solid fa-id-card me-1"></i>Plate Detection</a>
            </li>
            <li class="nav-item">

    </div>
  </div>
</nav>

<div class="container pb-5">

    <h2 class="fw-bold mb-1"><i class="fa-solid fa-clock-rotate-left text-primary"></i> Detection History</h2>
    <p class="text-muted mb-4">All vehicle and plate detections saved to the database.</p>

    <div class="av-card p-3 mb-4">
        <div class="row g-2">
            <div class="col-md-4">
                <input type="text" id="searchPlate" class="form-control" placeholder="Search plate number...">
            </div>
            <div class="col-md-3">
                <select id="typeFilter" class="form-select">
                    <option value="">All Types</option>
                    <option value="vehicle">Vehicle</option>
                    <option value="plate">Plate</option>
                </select>
            </div>
            <div class="col-md-2">
                <button id="searchBtn" type="button" class="btn btn-av w-100">Search</button>
            </div>
            <div class="col-md-2">
                <button id="clearBtn" type="button" class="btn btn-outline-secondary w-100">Clear</button>
            </div>
        </div>
    </div>

    <div id="historyError" class="alert alert-danger d-none"></div>

    <div class="av-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>ID</th><th>Type</th><th>Vehicle</th><th>Plate Number</th>
                        <th>Confidence</th><th>Date/Time</th><th>Image</th><th></th>
                    </tr>
                </thead>
                <tbody id="historyTable"></tbody>
            </table>
        </div>

        <nav>
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>

</div>
